# Test default: run with the security wall off so context-load and plain API tests don't need a
# password. Tests that exercise security (SecurityIntegrationTest) re-enable it and set a password
# via @DynamicPropertySource, which takes precedence over this file.
claude.security.enabled=false
# Pin the cli engine so context loads never probe for node / spawn version checks (the shipped
# application.yml selects sdk, whose startup probe runs `node --version` / `claude --version`).
claude.chat.engine=cli
# No background Lucene index in tests: it would write _claude-search-index into the project dir and
# race fixtures. SearchIndexIntegrationTest re-enables it against a temp dir.
claude.search.enabled=false
